# Render Blueprint para usar una base PostgreSQL YA EXISTENTE en Render.
# No crea otra base de datos. Los secretos deben configurarse en el Dashboard.
# Requiere MongoDB Atlas, Redis externo y un JWT_SECRET fuerte antes de desplegar.
services:
  - type: web
    name: mediconnect-pro-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: "8081"
      # En el Dashboard configurar los valores INTERNAL de la base ya creada:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DEV_ADMIN_EMAIL
        sync: false
      - key: DEV_ADMIN_PASSWORD
        sync: false
