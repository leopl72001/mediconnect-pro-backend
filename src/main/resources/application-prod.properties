# Se habilita solo cuando Docker y todas las conexiones esten listas.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:mediconnect2}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.mongodb.uri=${MONGO_URI}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.cache.type=redis
# La clave JWT en prod se exige por app.security.jwt-secret.
# Carga privada de archivos: limite HTTP y limite adicional en el servicio.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
