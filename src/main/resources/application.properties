spring.application.name=mediconnect
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8081}
spring.threads.virtual.enabled=true
spring.jpa.open-in-view=false
app.security.jwt-secret=${JWT_SECRET:}
app.security.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
management.endpoints.web.exposure.include=health,info,metrics,mediconnect2
management.endpoint.health.show-details=never
springdoc.swagger-ui.path=/swagger-ui.html
# Las migraciones se activan solo en producción nueva; perfil Docker local conserva sus datos.
spring.flyway.enabled=false
