# Perfil dev: usar H2, sin depender de MongoDB ni Redis. Nombres de autoconfiguracion de Spring Boot 4.
spring.datasource.url=jdbc:h2:mem:mediconnect2;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Solo para desarrollo local; JAMAS usar este secreto en produccion.
app.security.jwt-secret=${JWT_SECRET:local-development-only-secret-for-hs512-at-least-sixty-four-characters-2026}
spring.autoconfigure.exclude=org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration,org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration,org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
management.health.mongodb.enabled=false
management.health.redis.enabled=false
