name: MediConnect CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compilar, probar y empaquetar
        run: mvn -B verify
      - name: Validar Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
