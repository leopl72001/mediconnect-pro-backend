name: MediConnect Docker Integration
on:
  push:
    branches: [main, 'migracion/spring-boot-4']
  workflow_dispatch:

jobs:
  docker-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Preparar variables de demostracion
        run: cp .env.example .env
      - name: Construir y levantar PostgreSQL, MongoDB, Redis y la API
        run: docker compose up --build -d
      - name: Inspeccionar contenedores
        run: |
          docker compose ps
          docker compose logs --no-color --tail=80 app
      - name: Esperar API y comprobar health
        shell: bash
        run: |
          ready=0
          for i in $(seq 1 24); do
            if ! docker compose ps --status running --services | grep -qx app; then
              echo "La API dejo de ejecutarse."
              exit 1
            fi
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:8082/actuator/health | grep -q '"status":"UP"'; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1
          curl --max-time 10 -fsS http://127.0.0.1:8082/api/v1/specialties
      - name: Mostrar logs si falla
        if: failure()
        run: docker compose logs --no-color --tail=200 app postgres mongo redis
      - name: Limpiar contenedores
        if: always()
        run: docker compose down -v
